<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сочинений по "Ревизору"</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Merriweather:wght@300;400&display=swap');
    :root { --bg: #fdfcf8; --text: #232323; --accent: #8b0000; --short: #4a4a4a; }
    body { background-color: #dcdde1; font-family: 'Merriweather', serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .paper-sheet { background-color: var(--bg); max-width: 850px; width: 100%; padding: 50px 70px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border-top: 6px solid var(--accent); }
    h1 { font-family: 'Lora', serif; font-size: 24px; text-align: center; color: var(--accent); margin-bottom: 30px; text-transform: uppercase; }
    #essay-body { font-size: 1.15rem; text-align: justify; white-space: pre-wrap; min-height: 400px; line-height: 1.8; transition: opacity 0.3s; }
    .button-group { margin-top: 35px; display: flex; gap: 15px; justify-content: center; border-top: 1px solid #eee; padding-top: 25px; flex-wrap: wrap; }
    button { padding: 15px 25px; font-family: 'Lora', serif; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; color: white; transition: 0.3s; }
    .btn-full { background-color: var(--accent); }
    .btn-short { background-color: var(--short); }
    .btn-copy { background-color: #2d3436; width: 100%; max-width: 200px; margin-top: 10px; }
    button:hover { transform: translateY(-2px); filter: brightness(1.2); }
  </style>
</head>
<body>

<div class="paper-sheet">
  <h1>Сочинение по комедии «Ревизор»</h1>
  <div id="essay-body">Выберите формат сочинения и нажмите кнопку для генерации текста...</div>
  
  <div class="button-group">
    <button class="btn-full" onclick="generate(false)">ПОЛНЫЙ ВАРИАНТ</button>
    <button class="btn-short" onclick="generate(true)">КРАТКИЙ ВАРИАНТ</button>
    <button class="btn-copy" onclick="copyText()">КОПИРОВАТЬ ТЕКСТ</button>
  </div>
</div>

<script>
const data = {
    intro: {
        full: [
            "Бессмертная комедия Николая Васильевича Гоголя «Ревизор» является признанным шедевром русской драматургии, в котором автор задался целью собрать в одну кучу всё дурное в России и разом посмеяться над всем. Через призму провинциального уездного городка Гоголь транслирует системные проблемы государственного управления и человеческой морали, актуальные во все времена. В своей пьесе Гоголь отказывается от традиционной любовной интриги, выстраивая сюжет вокруг коллективного страха чиновников перед ревизией, что позволяет максимально обнажить пороки общества.",
            "Произведение «Ревизор» — это беспощадная сатира, в которой Гоголь мастерски выстраивает сюжет вокруг коллективного страха чиновников перед ревизией. Драматург сознательно отказывается от любовной линии, чтобы полностью сосредоточиться на социальных пороках общества, погрязшего во взяточничестве и кумовстве. Через этот конфликт автор исследует феномен «всеобщего плутовства», где ложь становится естественным способом существования всей городской верхушки власти, лишенной всякого понятия о гражданском долге и чести."
        ],
        short: [
            "Бессмертная комедия Н. В. Гоголя «Ревизор» представляет собой глубокую сатиру на российское общество, погрязшее во взяточничестве и должностных преступлениях. В этом произведении автор мастерски высмеивает систему власти, в которой страх перед законом заменяет чиновникам совесть.",
            "Комедия Гоголя «Ревизор» обнажает пороки провинциального чиновничества, создавая универсальный образ мира, живущего по законам лжи и чинопочитания. Гоголь показывает, как должностные лица направляют все силы лишь на то, чтобы пустить пыль в глаза проверяющему."
        ]
    },
    body: {
        full: [
            "В уездном городе царит тотальный беспорядок и имитация деятельности. Попечитель богоугодных заведений Земляника хвастает, что больные у него «выздоравливают как мухи», а судья Ляпкин-Тяпкин больше занят охотой, чем правосудием. Гоголь подчеркивает, что чиновники боятся не нарушения закона, а лишь потери теплого места. Иван Хлестаков — пустой и легкомысленный герой, ставший зеркалом для их грехов. Он не планирует обман, а лишь плывет по течению чужого страха, принимая взятки как должное. Его значимость — это мираж, порожденный нечистой совестью тех, кто привык судить о людях исключительно по чинам и петербургским связям, а не по их реальным делам.",
            "Система власти в пьесе парализована ленью и казнокрадством. Городничий Антон Антонович уверен, что любой грех можно прикрыть лестью или деньгами. Такое положение дел делает всё чиновничество беззащитным перед лицом мнимого ревизора. Явление «хлестаковщины» обнажает духовную пустоту общества, где внешняя форма и связи ценятся гораздо выше, чем реальные качества. В сцене вранья Хлестаков достигает апогея своего вдохновения, рассказывая о тридцати пяти тысячах курьеров. Опытные плуты принимают это нелепое хвастовство за признаки высокого статуса, становясь жертвами собственного воображения, так как сами привыкли жить в мире постоянного обмана и корысти."
        ],
        short: [
            "Центральное место занимает образ Хлестакова — пустого героя, чья мнимая важность создана лишь воображением перепуганных чиновников города. Гоголь показывает, как коррумпированная верхушка власти становится жертвой собственного страха и «миражной интриги» мелкого чиновника.",
            "Главным двигателем сюжета является коллективный страх чиновников перед ревизией, заставляющий их видеть в случайном проезжем Хлестакове грозное инкогнито. Явление «хлестаковщины» обнажает духовную пустоту общества, где форма ценится гораздо выше, чем реальные качества."
        ]
    },
    conclusion: {
        full: [
            "Особое место в композиции занимает «немая сцена» финала. Это момент истины, когда герои замирают в гротескных позах перед лицом настоящего правосудия. Гоголь настаивал, чтобы сцена длилась как можно дольше, подчеркивая вечность и неизбежность возмездия за жизнь, прожитую во лжи. Финал комедии переводит сатиру в философский план. Известие о прибытии настоящего ревизора разрушает карточный домик иллюзий городничего. Это призыв автора к каждому зрителю заглянуть в свою совесть, так как настоящий суд — это не чиновник из Петербурга, а внутренний моральный закон. Подводя итог, Гоголь создал шедевр, заставляющий нас бороться с внутренней «хлестаковщиной».",
            "Финал комедии переводит сатиру в философский план. Известие о прибытии настоящего ревизора по именному повелению разрушает карточный домик иллюзий городничего. Это призыв автора к каждому зрителю заглянуть в свою совесть, так как настоящий суд — это не чиновник из Петербурга, а внутренний моральный закон. Подводя итог, можно сказать, что Гоголь создал бессмертный шедевр, заставляющий каждое поколение заново переосмысливать понятия чести и ответственности. Фраза городничего «Над собой смеетесь!» обращена сквозь века к каждому из нас, напоминая, что за кривым зеркалом чинопочитания всегда скрывается духовная пустота, требующая очищения смехом."
        ],
        short: [
            "Финал пьесы и знаменитая «немая сцена» символизируют крах лжи перед лицом неизбежного правосудия, напоминая о важности личной нравственной ответственности. Комедия остается актуальной, заставляя каждого задуматься о чистоте собственной совести и долга.",
            "Завершая разбор, можно сказать, что «Ревизор» Гоголя остается вечным уроком честности и гражданского долга. Гоголевский смех служит очистительной силой, призывающей зрителя к внутреннему преображению и борьбе с пороками тщеславия и «хлестаковщины»."
        ]
    }
};

function generate(isShort) {
    const pick = (field) => {
        const options = data[field][isShort ? 'short' : 'full'];
        return options[Math.floor(Math.random() * options.length)];
    };
    
    const output = document.getElementById('essay-body');
    output.style.opacity = '0';
    
    setTimeout(() => {
        const text = `   ${pick('intro')}\n\n   ${pick('body')}\n\n   ${pick('conclusion')}`;
        output.innerText = text;
        output.style.opacity = '1';
    }, 200);
}

function copyText() {
    const text = document.getElementById('essay-body').innerText;
    if (text.length < 50) return;
    navigator.clipboard.writeText(text).then(() => {
        alert('Текст скопирован!');
    });
}
</script>

</body>
</html>
