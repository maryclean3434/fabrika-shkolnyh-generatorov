<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расширенный генератор: Образ Хлестакова</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; padding: 20px; }
    .main-card { background: white; max-width: 700px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .content-area { margin-top: 20px; line-height: 1.8; color: #444; background: #fdfdfd; padding: 20px; border: 1px dashed #cbd5e0; border-radius: 8px; min-height: 300px; }
    .controls { margin-top: 25px; display: flex; gap: 10px; }
    button { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
    .btn-generate { background-color: #3498db; color: white; }
    .btn-generate:hover { background-color: #2980b9; }
    .copy-hint { text-align: center; font-size: 12px; color: #999; margin-top: 10px; }
  </style>
</head>
<body>

<div class="main-card">
  <h2>Образ Хлестакова в комедии «Ревизор»</h2>
  <div id="result" class="content-area">Нажмите «Сгенерировать», чтобы получить развернутое сочинение...</div>
  
  <div class="controls">
    <button class="btn-generate" onclick="generateLongEssay()">Сгенерировать большое сочинение</button>
  </div>
  <p class="copy-hint">Текст подходит для подготовки к урокам литературы и ВПР.</p>
</div>

<script>
function generateLongEssay() {
    const parts = {
        intro: [
            "Комедия Н. В. Гоголя «Ревизор» подарила мировой литературе один из самых ярких и психологически точных образов — Ивана Александровича Хлестакова. Этот герой не просто участник сюжета, а олицетворение целого социального явления.",
            "Иван Александрович Хлестаков — персонаж, чье имя стало нарицательным. В его образе Гоголь мастерски воплотил пустоту, легкомыслие и стремление казаться тем, кем человек на самом деле не является.",
            "Центральное место в пьесе «Ревизор» занимает фигура Хлестакова. Через этого героя автор раскрывает главную тему произведения — торжество лжи и страха в обществе, где чины важнее человеческих качеств."
        ],
        appearance: [
            "Гоголь описывает его как молодого человека лет двадцати трех, тоненького и худенького, который выглядит несколько глуповатым. Он — мелкий чиновник четырнадцатого класса, «елестратишка», не имеющий ни веса в обществе, ни денег.",
            "Внешне Хлестаков ничем не примечателен: это небогатый чиновник из Петербурга, который одет по моде, но при этом находится в крайне бедственном положении из-за своей страсти к картам и кутежам.",
            "Автор подчеркивает, что Хлестаков «без царя в голове». Его облик лишен значительности, однако именно эта заурядность позволяет чиновникам уездного города дорисовать в своем воображении образ грозного ревизора."
        ],
        lying: [
            "Ключевым моментом в раскрытии персонажа является сцена вранья. Опьяненный вниманием и вином, Хлестаков начинает рассказывать о своей «блестящей» жизни в Петербурге, где он якобы дружит с Пушкиным и управляет департаментом.",
            "Герой врет вдохновенно, сам веря в каждое свое слово. Он рассказывает о тридцати пяти тысячах курьеров и о том, как его боится сам государственный совет. В этой лжи проявляется его истинная натура — мелочная и тщеславная.",
            "Удивительно, что Хлестаков не пытается никого обмануть намеренно. Он просто плывет по течению чужих страхов, мгновенно подстраиваясь под ситуацию и принимая подношения как должное вознаграждение за свою мнимую важность."
        ],
        philosophy: [
            "«Хлестаковщина» — это отсутствие внутреннего стержня. Герой пуст, как мыльный пузырь, и наполняется тем содержанием, которое в него вкладывают окружающие. Именно поэтому он так легко входит в роль важного чиновника.",
            "Для Хлестакова не существует моральных принципов или долгосрочных целей. Он живет одним днем: если сегодня его кормят и почитают, он счастлив. Эта духовная нищета делает его одновременно комичным и пугающим персонажем.",
            "Его поведение в доме городничего, ухаживание одновременно за матерью и дочерью подчеркивают его крайнюю пошлость и отсутствие всякого понятия о чести или искренних чувствах."
        ],
        conclusion: [
            "В завершение стоит отметить, что Хлестаков — это зеркало уездного города. Его «значительность» создана коллективным страхом чиновников, совершивших множество преступлений и боящихся возмездия.",
            "Таким образом, Гоголь показал, что Хлестаков живет в каждом из нас, когда мы пытаемся пустить пыль в глаза или боимся правды. Этот образ остается актуальным, пока в обществе сохраняется чинопочитание.",
            "Подводя итог, можно сказать, что Хлестаков — гениальная находка автора. Через пустоту этого героя Гоголь сумел высветить всю полноту пороков государственного аппарата и человеческой души."
        ]
    };

    const getRnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
    
    const fullText = `   ${getRnd(parts.intro)}\n\n   ${getRnd(parts.appearance)} ${getRnd(parts.lying)}\n\n   ${getRnd(parts.philosophy)}\n\n   ${getRnd(parts.conclusion)}`;
    
    document.getElementById('result').innerText = fullText;
}
</script>

</body>
</html>
