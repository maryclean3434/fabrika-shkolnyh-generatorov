<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фабрика Школьных Генераторов</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #333; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .links-list { list-style: none; padding: 0; margin-top: 20px; }
        .links-list li { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 10px; border-radius: 5px; }
        .btn-link { color: #3498db; text-decoration: none; font-weight: bold; }
        .btn-copy { background: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Мои Генераторы</h1>
    <ul class="links-list">
        <!-- Добавляйте сюда новые генераторы по аналогии -->
        <li>
            <span>Образ Хлестакова</span>
            <a href="obrazhlestakova.html" class="btn-link">Открыть</a>
            <button class="btn-copy" onclick="copyLink('obrazhlestakova.html')">Копировать ссылку</button>
        </li>
    </ul>
</div>

<script>
    function copyLink(fileName) {
        // Автоматически берет текущий адрес сайта и добавляет имя файла
        const fullPath = window.location.href + fileName;
        navigator.clipboard.writeText(fullPath);
        alert('Ссылка скопирована!');
    }
</script>

</body>
</html>
