<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фабрика Генераторов</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .panel { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        #list { list-style: none; padding: 0; }
        .file-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid #eee; transition: 0.2s;
        }
        .file-item:hover { background: #f8f9fa; }
        .file-name { font-weight: 500; color: #3c4043; text-transform: capitalize; }
        .actions { display: flex; gap: 8px; }
        button, a { 
            text-decoration: none; padding: 8px 12px; border-radius: 6px; 
            font-size: 13px; cursor: pointer; border: none;
        }
        .btn-open { background: #e8f0fe; color: #1a73e8; }
        .btn-copy { background: #ceead6; color: #0d652d; }
    </style>
</head>
<body>

<div class="panel">
    <h1>Моя Фабрика ГЕНЕРАТОРОВ 🏭</h1>
    <div id="loader">Загрузка списка файлов...</div>
    <ul id="list"></ul>
</div>

<script>
    const USER = 'maryclean3434';
    const REPO = 'fabrika-shkolnyh-generatorov';

    // 1. Добавьте сюда переводы для ваших файлов
    const translations = {
        'Obrazhlestakova': 'Образ Хлестакова (Ревизор)',
        'Gensochsvin': 'Сочинение по картинке (Свинка)',
        'Gensoch': 'Генератор сочинений',
        'Math Quiz': 'Тест по математике'
    };

    async function loadFiles() {
        try {
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
            const files = await response.json();
            
            const listElement = document.getElementById('list');
            document.getElementById('loader').style.display = 'none';

            const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

            htmlFiles.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                // 2. Берем имя файла без .html
                const rawName = file.name.replace('.html', '');
                
                // 3. Проверяем: есть ли перевод в словаре? Если нет — просто убираем подчеркивания
                const displayName = translations[rawName] || rawName.replace(/_/g, ' ');

                const siteUrl = `https://${USER}.github.io/${REPO}/${file.name}`;
                
                li.innerHTML = `
                    <span class="file-name">${displayName}</span>
                    <div class="actions">
                        <a href="${siteUrl}" target="_blank" class="btn-open">Открыть</a>
                        <button class="btn-copy" onclick="copy('${siteUrl}')">Копировать</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
        } catch (e) {
            document.getElementById('loader').innerText = 'Ошибка загрузки :(';
        }
    }

    function copy(url) {
        navigator.clipboard.writeText(url);
        alert('Рабочая ссылка скопирована!');
    }

    loadFiles();
</script>


</body>
</html>
