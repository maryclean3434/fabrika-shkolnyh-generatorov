<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фабрика Генераторов</title>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .panel { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 25px; }
        #list { list-style: none; padding: 0; }
        .file-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid #eee; transition: 0.2s;
        }
        .file-item:hover { background: #f8f9fa; }
        .file-name { font-weight: 500; color: #3c4043;}
        .actions { display: flex; gap: 8px; }
        button, a { 
            text-decoration: none; padding: 8px 12px; border-radius: 6px; 
            font-size: 13px; cursor: pointer; border: none;
        }
        .btn-open { background: #e8f0fe; color: #1a73e8; }
        .btn-copy { background: #ceead6; color: #0d652d; }
    </style>
    
</head>
<body>

<div class="panel">
    <h1>Моя Фабрика ГЕНЕРАТОРОВ 🏭</h1>
    <div id="loader">Загрузка списка файлов...</div>
    <ul id="list"></ul>
</div>

<script>
    const USER = 'maryclean3434';
    const REPO = 'fabrika-shkolnyh-generatorov';

    async function loadFiles() {
    try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
        const files = await response.json();
        
        const listElement = document.getElementById('list');
        document.getElementById('loader').style.display = 'none';

        // Отбираем только HTML файлы (кроме главной)
        const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

        // Шаг 1: Создаем массив для хранения данных о генераторах
        let generatorsList = [];

        for (const file of htmlFiles) {
            const fileDataResponse = await fetch(file.url);
            const fileData = await fileDataResponse.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            
            // Извлекаем русский заголовок из <title>
            const match = content.match(/<title>(.*?)<\/title>/i);
            const displayName = match ? match[1] : file.name.replace('.html', '');
            const siteUrl = `https://${USER}.github.io/${REPO}/${file.name}`;

            // Добавляем объект в наш список
            generatorsList.push({
                title: displayName,
                link: siteUrl
            });
        }

        // Шаг 2: Сортируем список по русскому алфавиту (по свойству title)
        generatorsList.sort((a, b) => a.title.localeCompare(b.title, 'ru'));

        // Шаг 3: Выводим отсортированные элементы на страницу
        generatorsList.forEach(item => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <span class="file-name">${item.title}</span>
                <div class="actions">
                    <a href="${item.link}" target="_blank" class="btn-open">Открыть</a>
                    <button class="btn-copy" onclick="copy('${item.link}')">Копировать</button>
                </div>
            `;
            listElement.appendChild(li);
        });

    } catch (e) {
        console.error(e);
        document.getElementById('loader').innerText = 'Ошибка при загрузке списка.';
    }
}


    function copy(url) {
        navigator.clipboard.writeText(url);
        alert('Ссылка скопирована!');
    }

    loadFiles();
</script>




</body>
</html>
